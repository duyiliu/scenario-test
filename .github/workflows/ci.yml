name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 单测矩阵：Node 20/22 × Ubuntu/Windows。构建链要求 Node 20+；
  # Windows 覆盖路径、CRLF 与 PowerShell 相关用例。
  unit_tests:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 单元/集成测试
        run: npm test

      - name: 行尾审计
        run: npm run check:eol

  # 稳定的聚合检查名，便于分支保护只要求 `unit`（矩阵子任务任一失败即失败）。
  unit:
    name: unit
    needs: unit_tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总单测矩阵
        run: |
          echo "unit matrix result: ${{ needs.unit_tests.result }}"
          if [ "${{ needs.unit_tests.result }}" != "success" ]; then
            echo "::error::unit 矩阵未全部通过（result=${{ needs.unit_tests.result }}）"
            exit 1
          fi

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 使用 Playwright 安装的 Chromium，而非依赖 runner 预装的 Google Chrome。
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 浏览器测试
        run: npm run test:browser
