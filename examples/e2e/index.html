<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>框架测试工作台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#0f172a;background:#f8fafc}*{box-sizing:border-box}body{margin:0}.shell{height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:28px;height:56px;padding:0 20px;background:#fff;border-bottom:1px solid #e2e8f0;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.02)}.brand{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;letter-spacing:-.01em}.brand::before{content:"";width:10px;height:10px;border-radius:3px;background:#0f172a}.tabs{display:flex;align-self:stretch;gap:24px}.tabs button{font:12.5px inherit;border:0;border-bottom:2px solid transparent;background:none;color:#64748b;cursor:pointer;padding:0 2px}.tabs button:hover{color:#0f172a}.tabs button[aria-selected=true]{border-bottom-color:#10b981;color:#0f172a;font-weight:600}.hint{margin-left:auto;font-size:12px;color:#94a3b8}.panel{flex:1;min-height:0}.panel[hidden]{display:none}#scenario-test,#e2e-root{width:100%;height:100%}#e2e-root{min-height:0;overflow:hidden}button:focus-visible{outline:2px solid rgba(51,65,85,.35);outline-offset:-4px}
</style></head>
<body><div class="shell"><header class="top" data-scenario-test-e2e><strong class="brand">框架测试工作台</strong><nav class="tabs" role="tablist" aria-label="测试类型"><button id="http-tab" role="tab" aria-selected="true" aria-controls="http-panel">接口场景</button><button id="e2e-tab" role="tab" aria-selected="false" aria-controls="e2e-panel">浏览器 E2E</button></nav><span class="hint">本地模拟数据 · 不连接业务环境</span></header>
<section class="panel" id="http-panel" role="tabpanel" aria-labelledby="http-tab"><div id="scenario-test"></div></section>
<section class="panel" id="e2e-panel" role="tabpanel" aria-labelledby="e2e-tab" hidden><div id="e2e-root"></div></section></div>
<script src="/__scenario-test__/scenario-test.umd.js"></script><script src="./scenario.config.js"></script><script src="/e2e/panel.js"></script><script>
ScenarioTest.createApp({mount:'#scenario-test',config:ScenarioTest.getConfig()});
const tabs=[document.getElementById('http-tab'),document.getElementById('e2e-tab')];
let e2eApp=null;
function parseHash(){const raw=location.hash.replace(/^#/,'');const [tab,...rest]=raw.split('&');return {tab:tab==='e2e'?'e2e':'http',spec:new URLSearchParams(rest.join('&')).get('spec')||''};}
function writeHash(tab,spec,push){const hash='#'+tab+(spec?'&spec='+encodeURIComponent(spec):'');if(location.hash===hash)return;const url=location.pathname+location.search+hash;if(push)history.pushState(null,'',url);else history.replaceState(null,'',url);}
function ensureE2E(spec){if(e2eApp)return;if(!window.ScenarioTestE2E){document.getElementById('e2e-root').textContent='E2E 面板未加载';return}e2eApp=ScenarioTestE2E.mountE2E(document.getElementById('e2e-root'),{mode:'embedded',spec:spec||undefined,onSpecChange:next=>writeHash('e2e',next,true)});}
function select(tab,sync){for(const item of tabs){const active=item===tab;item.setAttribute('aria-selected',String(active));document.getElementById(item.getAttribute('aria-controls')).hidden=!active;}if(tab===tabs[1]){ensureE2E(parseHash().spec);if(e2eApp)e2eApp.setActive(true);}else if(e2eApp)e2eApp.setActive(false);if(sync!==false)writeHash(tab.id==='e2e-tab'?'e2e':'http',parseHash().spec,true);}
tabs.forEach(tab=>{tab.onclick=()=>select(tab);tab.onkeydown=event=>{if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();const next=tabs[1-tabs.indexOf(tab)];select(next);next.focus();}}});
window.addEventListener('popstate',()=>{const h=parseHash();select(h.tab==='e2e'?tabs[1]:tabs[0],false);if(e2eApp&&h.tab==='e2e'&&h.spec)e2eApp.setSpec(h.spec);});
const initial=parseHash();select(initial.tab==='e2e'?tabs[1]:tabs[0],false);
</script></body></html>
